<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>국내 연예 갤러리 - [통합] 신작 영화 캐스팅</title>
<style>
    /* =========================================
       [CORE DESIGN SYSTEM]
       ========================================= */
    :root {
        --blue: #3b4890;       /* DC Signature Blue */
        --deep-blue: #29367c;
        --light-gray: #f9f9f9;
        --border: #d5d5d5;
        --concept: #d31900;    /* Best Post Red */
        --text-main: #333;
        --text-sub: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
        font-family: 'Malgun Gothic', 'Dotum', sans-serif; 
        background: #fff; 
        color: var(--text-main); 
        font-size: 13px;
        line-height: 1.4;
    }
    
    a { text-decoration: none; color: inherit; cursor: pointer; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea { outline: none; font-family: inherit; font-size: 13px; border-radius: 0; -webkit-appearance: none; }

    /* 레이아웃 */
    .wrap { 
        width: 100%; 
        max-width: 1100px; 
        margin: 0 auto; 
        min-height: 100vh;
        position: relative;
    }

    /* [HEADER] */
    header { padding: 15px 10px; margin-bottom: 10px; border-bottom: 2px solid var(--blue); }
    .header-top { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        flex-wrap: wrap; 
        gap: 10px;
    }
    .gal-tit { 
        font-size: 22px; 
        font-weight: bold; 
        color: var(--blue); 
        letter-spacing: -1px; 
        cursor: pointer; 
    }
    .gal-sub { 
        font-size: 12px; 
        color: #555; 
        margin-left: 5px; 
        font-weight: normal; 
    }
    
    /* 유저 설정 영역 */
    .user-config { 
        text-align: right; 
        font-size: 12px; 
        display: flex; 
        align-items: center; 
        gap: 8px;
        background: #f9f9f9;
        padding: 5px 10px;
        border-radius: 4px;
    }
    .inp-conf {
        border: none;
        border-bottom: 1px solid #aaa;
        background: transparent;
        text-align: center;
        width: 60px;
        font-weight: bold;
        color: #333;
        font-size: 12px;
    }
    .lbl { color: #888; font-size: 11px; }

    /* [MAIN LAYOUT] */
    .container { display: flex; gap: 20px; padding: 10px; }
    .main-content { flex: 1; min-width: 0; }
    .side-content { width: 280px; flex-shrink: 0; }

    /* [BOARD CONTROLS] */
    .board-ctrl { 
        display: flex; 
        justify-content: space-between; 
        align-items: flex-end; 
        margin-bottom: 8px; 
    }
    .tab-box { display: flex; gap: -1px; }
    .tab { 
        padding: 8px 16px; 
        border: 1px solid #ccc; 
        border-bottom: none; 
        background: #fcfcfc; 
        color: #555; 
        cursor: pointer; 
        font-size: 12px;
        font-weight: bold;
    }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tab.concept { color: var(--concept); }
    .tab.concept.active { background: var(--concept); border-color: var(--concept); color: #fff; }

    .btn-group { display: flex; gap: 4px; }
    .btn-group button { 
        padding: 6px 12px; 
        border: 1px solid #ccc; 
        background: #fff; 
        font-size: 12px; 
        font-weight: bold; 
        color: #333; 
    }
    .btn-group button.write { background: var(--blue); color: #fff; border-color: var(--deep-blue); }

    /* [BOARD TABLE] */
    .list-table { 
        width: 100%; 
        border-collapse: collapse; 
        border-top: 2px solid var(--blue); 
        table-layout: fixed; 
    }
    .list-table th { 
        background: #fcfcfc; 
        padding: 10px 0; 
        border-bottom: 1px solid #ccc; 
        font-weight: normal; 
        color: #333; 
        font-size: 12px;
    }
    .list-table td { 
        padding: 8px 0; 
        border-bottom: 1px solid #eee; 
        text-align: center; 
        color: #666; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
    }
    
    .td-tit { 
        text-align: left !important; 
        padding-left: 10px !important; 
        padding-right: 5px;
        color: #333; 
        cursor: pointer; 
    }
    .td-tit:hover { text-decoration: underline; color: var(--blue); }
    .td-tit:visited { color: #aaa; }
    
    .icon-concept { 
        display: inline-block; padding: 1px 3px; 
        background: var(--concept); color: #fff; 
        font-size: 10px; border-radius: 2px; 
        margin-right: 4px; vertical-align: middle; 
        position: relative; top: -1px;
    }
    .reply-cnt { 
        font-family: Tahoma, sans-serif; 
        font-size: 11px; color: var(--concept); 
        font-weight: bold; margin-left: 3px; 
    }
    
    .notice-row td { background: #f5f7f9; font-weight: bold; color: #111; }
    .concept-row td { background: #fffdfd; }

    /* [PAGING] */
    .paging { margin-top: 20px; text-align: center; margin-bottom: 30px; }
    .pg-box { display: inline-flex; border: 1px solid #ccc; border-right: none; }
    .pg-btn { 
        padding: 6px 12px; border-right: 1px solid #ccc; 
        background: #fff; cursor: pointer; color: #555; 
        font-size: 12px;
    }
    .pg-btn:hover { background: #f0f0f0; }
    .pg-btn.on { background: var(--blue); color: #fff; font-weight: bold; }

    /* [SIDEBAR] */
    .widget { border: 1px solid #ddd; margin-bottom: 15px; background: #fff; }
    .w-tit { 
        background: #f5f7f9; padding: 10px 12px; 
        border-bottom: 1px solid #ddd; font-weight: bold; 
        color: var(--blue); display: flex; justify-content: space-between; 
        font-size: 13px;
    }
    .w-list li { 
        padding: 8px 12px; border-bottom: 1px solid #eee; 
        display: flex; gap: 8px; cursor: pointer; 
        font-size: 12px; align-items: center;
    }
    .w-list li:hover { background: #fafafa; }
    .rank-num { font-weight: bold; color: var(--concept); width: 16px; text-align: center; }
    .rank-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* [MODAL] */
    .modal-mask { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.6); z-index: 9999; 
        justify-content: center; align-items: center; 
    }
    .modal-win { 
        background: #fff; width: 900px; max-width: 95%; height: 90vh; 
        display: flex; flex-direction: column; border: 1px solid #000; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }
    .m-head { 
        background: var(--blue); color: #fff; padding: 12px 15px; 
        font-weight: bold; display: flex; justify-content: space-between; 
        font-size: 14px;
    }
    .m-close { cursor: pointer; font-size: 20px; font-weight: normal; }
    .m-body { flex: 1; overflow-y: auto; position: relative; }

    /* VIEW STYLE */
    .view-wrap { padding: 20px; }
    .v-head { 
        border-bottom: 1px solid #eee; padding: 15px; 
        background: #fbfbfb; border: 1px solid #ddd; margin-bottom: 20px; 
    }
    .v-tit { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #111; }
    .v-meta { display: flex; justify-content: space-between; font-size: 12px; color: #777; }
    .v-con { 
        min-height: 200px; font-size: 14px; line-height: 1.6; 
        color: #333; margin-bottom: 40px; white-space: pre-wrap; word-break: break-all;
    }
    
    .vote-area { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .vote-btn { 
        width: 80px; height: 80px; border: 1px solid #ccc; border-radius: 10px; 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        cursor: pointer; 
    }
    .vote-btn.up { border-color: var(--concept); color: var(--concept); background: #fffdfd; }
    .vote-btn:hover { box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .v-num { font-size: 18px; font-weight: bold; }

    /* ★ [COMMENT STYLE - FIX] ★ */
    .cmt-box { background: #f8f9fa; border-top: 2px solid var(--blue); padding: 15px; }
    .cmt-row { 
        display: flex; 
        padding: 8px 0; 
        border-bottom: 1px dotted #ccc; 
        font-size: 12px; 
        gap: 15px; /* 닉네임과 내용 사이 간격 추가 */
        align-items: flex-start;
    }
    .c-nick { 
        font-weight: bold; 
        width: 90px; 
        color: #333; 
        text-overflow: ellipsis; 
        overflow: hidden; 
        white-space: nowrap; 
        flex-shrink: 0; /* 너비 고정 */
        text-align: left;
    }
    .c-txt { 
        flex: 1; 
        color: #444; 
        word-break: break-all; 
        line-height: 1.4;
    }
    .c-date { 
        width: 60px; 
        text-align: right; 
        color: #999; 
        font-size: 11px; 
        flex-shrink: 0;
    }

    /* 댓글 입력창 스타일 */
    .cw-box { 
        margin-top: 15px; 
        background: #fff; 
        border: 1px solid #ccc; 
        padding: 10px; 
        display: flex; 
        gap: 5px; 
        align-items: center;
    }
    .cw-nick { 
        width: 80px; 
        height: 30px; 
        border: 1px solid #ddd; 
        background: #fafafa;
        text-align: center;
        font-weight: bold;
        font-size: 12px;
        color: #333;
    }
    .cw-inp { 
        flex: 1; 
        height: 30px; 
        border: 1px solid #ddd; 
        padding: 5px; 
        font-size: 12px; 
    }
    .cw-btn { 
        background: #555; 
        color: #fff; 
        border: none; 
        padding: 0 15px; 
        height: 30px; 
        font-weight: bold; 
        font-size: 12px; 
    }

    /* WRITE STYLE */
    .write-wrap { padding: 20px; display: none; background: #fff; height: 100%; }
    .w-row { display: flex; gap: 5px; margin-bottom: 10px; }
    .w-inp { width: 100%; padding: 10px; border: 1px solid #ccc; font-size: 14px; font-weight: bold; }
    .w-con { width: 100%; height: 450px; padding: 10px; border: 1px solid #ccc; resize: none; font-size: 14px; line-height: 1.5; }
    .w-btn-area { text-align: right; margin-top: 10px; }
    .w-btn { padding: 10px 30px; background: var(--blue); color: #fff; border: none; font-weight: bold; font-size: 14px; }

    /* [MOBILE] */
    @media (max-width: 768px) {
        .container { flex-direction: column; padding: 0; }
        .side-content { width: 100%; order: -1; margin-bottom: 20px; }
        .gal-tit { font-size: 18px; } .gal-sub { display: none; }
        
        .list-table th, .list-table td { font-size: 13px; padding: 12px 5px; }
        .list-table th:nth-child(1), .list-table td:nth-child(1), 
        .list-table th:nth-child(4), .list-table td:nth-child(4), 
        .list-table th:nth-child(5), .list-table td:nth-child(5) { display: none; }

        .list-table col:nth-child(2) { width: auto; }
        .list-table col:nth-child(3) { width: 80px; }
        .list-table col:nth-child(6) { width: 40px; }
        
        .modal-win { width: 100%; height: 100%; border: none; max-width: 100%; }
    }
</style>
</head>
<body>

<div class="wrap">
    <header>
        <div class="header-top">
            <div class="gal-tit" onclick="location.reload()">
                국내 연예 갤러리 <span class="gal-sub">Drama & Actor</span>
            </div>
            
            <div class="user-config">
                <span class="lbl">세계관 감독명:</span>
                <input type="text" id="target-name" class="inp-conf" value="User" onchange="saveConfig()">
                
                <span class="lbl" style="margin-left:5px;">내 닉네임:</span>
                <input type="text" id="my-nick-header" class="inp-conf" value="ㅇㅇ" onchange="syncNick(this.value)">
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="board-ctrl">
                <div class="tab-box">
                    <div id="tab-all" class="tab active" onclick="changeTab('all')">전체글</div>
                    <div id="tab-best" class="tab concept" onclick="changeTab('best')">개념글</div>
                </div>
                <div class="btn-group">
                    <button class="write" onclick="openWrite()">글쓰기</button>
                    <button onclick="refreshBoard()">새로고침</button>
                </div>
            </div>

            <table class="list-table">
                <colgroup>
                    <col width="50"><col width="*"><col width="100"><col width="50"><col width="50"><col width="40">
                </colgroup>
                <thead>
                    <tr><th>번호</th><th>제목</th><th>글쓴이</th><th>날짜</th><th>조회</th><th>추천</th></tr>
                </thead>
                <tbody id="board-body"></tbody>
            </table>

            <div class="paging">
                <div class="pg-box" id="pagination"></div>
            </div>
        </div>

        <div class="side-content">
            <div class="widget">
                <div class="w-tit">
                    <span>실시간 베스트</span>
                    <span style="font-size:11px; color:#999; font-weight:normal; cursor:pointer;" onclick="changeTab('best')">더보기 ></span>
                </div>
                <ul class="w-list" id="best-widget"></ul>
            </div>

            <div class="widget" style="margin-top:15px;">
                <div class="w-tit"><span>최근 방문 갤러리</span></div>
                <div style="padding:15px; font-size:12px; color:#555; line-height:1.6;">
                    - 영화 촬영 마이너 갤러리<br>
                    - 스윗하트(Sweet Heart)<br>
                    - 최서연 마이너 갤러리<br>
                    - 주식 갤러리<br>
                    - 인터넷방송 갤러리
                </div>
            </div>
            
            <div style="text-align:right; margin-top:10px;">
                <span class="reset-btn" onclick="resetAll()">[데이터 초기화]</span>
            </div>
        </div>
    </div>
</div>

<div id="modal" class="modal-mask">
    <div class="modal-win">
        <div class="m-head">
            <span id="m-tit">게시글 읽기</span>
            <span class="m-close" onclick="closeModal()">X</span>
        </div>
        <div class="m-body">
            
            <div id="view-layer" class="view-wrap">
                <div class="v-head">
                    <div class="v-tit" id="v-subject">제목</div>
                    <div class="v-meta">
                        <span id="v-nick">글쓴이</span>
                        <span>
                            <span id="v-date">날짜</span> | 
                            조회 <span id="v-views">0</span> | 
                            추천 <span id="v-recs">0</span>
                        </span>
                    </div>
                </div>
                <div class="v-con" id="v-content">내용</div>
                
                <div class="vote-area">
                    <div class="vote-btn up" onclick="doVote(1)">
                        <div class="v-num" id="vote-up">0</div><div>개념글</div>
                    </div>
                    <div class="vote-btn down" onclick="doVote(-1)">
                        <div class="v-num" id="vote-down">0</div><div>비추</div>
                    </div>
                </div>

                <div class="cmt-box">
                    <div style="font-weight:bold; margin-bottom:10px;">
                        전체 댓글 <span style="color:#d31900;" id="cmt-cnt">0</span>개
                    </div>
                    <div id="cmt-list"></div>
                    <div class="cw-box">
                        <input type="text" class="cw-nick" id="cmt-nick" value="ㅇㅇ">
                        <input type="text" class="cw-inp" id="cmt-input" placeholder="내용을 입력하세요..." onkeypress="if(event.keyCode==13) addComment()">
                        <button class="cw-btn" onclick="addComment()">등록</button>
                    </div>
                </div>
            </div>

            <div id="write-layer" class="write-wrap">
                <div class="w-row">
                    <input type="text" class="w-inp" id="w-nick" value="ㅇㅇ" style="width:120px;" placeholder="닉네임">
                    <input type="text" class="w-inp" id="w-pw" style="width:100px;" placeholder="비밀번호(선택)">
                </div>
                <input type="text" class="w-inp" id="w-tit" placeholder="제목을 입력해 주세요.">
                <textarea class="w-con" id="w-con" placeholder="내용을 입력해 주세요. (욕설, 도배 금지)"></textarea>
                <div class="w-btn-area">
                    <button class="w-btn" onclick="savePost()">등록완료</button>
                </div>
            </div>

        </div>
    </div>
</div>
<script>
/* ==========================================================================
   [Part 2] SCENARIO DATABASE
   설명: 사이트 접속 시 기본적으로 깔려있는 게시글 데이터 (약 40개)
   특징: 댓글에도 작성 시간(d) 데이터를 추가하여 리얼리티 강화
   ========================================================================== */

const NOTICE_DB = [
    {
        id: "공지", title: "[필독] 촬영장 스포일러 및 배우 비방 관련 제재 안내 (PDF 채증 중)", nick: "<b>운영자</b>", 
        date: "01.01", view: 254020, rec: 1520, notice: true,
        con: `안녕하세요. 운영자입니다.\n\n최근 신작 영화 오디션과 관련하여 확인되지 않은 루머 유포와 특정 배우에 대한 인신공격성 게시물이 폭증하고 있습니다.\n제작사와 소속사 측의 요청으로 모니터링이 강화되었음을 알려드립니다.\n\n특히 최모 배우, 김모 아이돌 관련 악플은 선처 없이 법적 대응 예정입니다.`,
        cmts: []
    },
    {
        id: "공지", title: "★ 신작 영화 캐스팅 라인업 정리 (실시간 업데이트) ★", nick: "파딱", 
        date: "01.02", view: 89000, rec: 440, notice: true,
        con: `현재까지 오디션장 목격담으로 확인된 리스트임.\n\n1. 최서연 (전 톱스타 / 현재 자숙중)\n2. 김하늘 (스윗하트 멤버)\n3. 윤소라 (신인)\n4. 한예은 (일반인)\n\n추가되는 대로 업뎃함. 뇌피셜 자제 좀.`,
        cmts: []
    }
];

// 접속하자마자 보이는 '기존 글'들
const INITIAL_DB = [
    // --- [개념글: 화력이 높은 떡밥] ---
    {
        id: 5025, title: "최서연 오늘자 오디션장 출근길 기사 사진 뜸;; (존예 주의)", nick: "ㅇㅇ(223.39)", 
        date: "14:42", view: 15420, rec: 855,
        con: `보라색 긴 생머리에 검은색 수트를 입고 차가운 표정으로 걷는 최서연...\n\n와... 진짜 사람이냐?\n갑질로 나락 가고 1년 만에 보는 건데 독기 품으니까 더 예뻐짐;;\n기자가 마이크 들이대는데 쳐다도 안 보고 지나가는 거 봐라 ㅋㅋㅋ\n성격은 여전한 듯. 근데 저 얼굴이면 난 뺨 맞아도 용서 가능함.`,
        cmts: [
            {n:"ㅇㅇ", t:"솔직히 와꾸로는 못 깐다 ㄹㅇ", d:"14:43"},
            {n:"dd", t:"인성 쓰레기 미화 좀 하지마라 토나옴", d:"14:45"},
            {n:"현장스탭", t:"오늘 대기실 분위기 살벌했음.. 최서연 들어오니까 홍해 갈라지듯 길 터주더라", d:"14:50"},
            {n:"얼빠", t:"감독님 제발 최서연 뽑아주세요 비주얼 합 미쳤음", d:"14:52"}
        ]
    },
    {

// 2. 데이터베이스 초기화
function initDB() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) {
        DB = JSON.parse(saved);
    } else {
        // 저장된 게 없으면 [Part 2, 3, 4] 데이터 병합
        // NOTICE_DB, INITIAL_DB, PAST_DB_1, PAST_DB_2는 이전 파트들에 정의됨
        DB = [...NOTICE_DB, ...INITIAL_DB, ...PAST_DB_1, ...PAST_DB_2];
        
        // 정렬: 공지 우선, 그 외 ID 내림차순(최신순)
        sortDB();
        saveData();
    }
}

function sortDB() {
    DB.sort((a,b) => {
        if(a.notice && !b.notice) return -1;
        if(!a.notice && b.notice) return 1;
        // 둘 다 공지거나 둘 다 일반글이면 ID 역순
        const idA = (typeof a.id === 'number') ? a.id : 999999;
        const idB = (typeof b.id === 'number') ? b.id : 999999;
        return idB - idA;
    });
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
}

    if(confirm("모든 데이터를 초기화하시겠습니까?\n작성한 글과 댓글이 모두 삭제됩니다.")) {

    let maxId = 0;
    DB.forEach(p => { if(!p.notice && typeof p.id === 'number' && p.id > maxId) maxId = p.id; });

    // 10개 생성 루프

        maxId++;

            id: maxId,
            title: randTitle,
            nick: randNick,
            date: timeStr,
            view: Math.floor(Math.random() * 50) + 1, // 조회수 1~50
            rec: 0,
            notice: false,
            con: randCon,
            cmts: []
        };
        
        // DB에 추가 (공지 뒤에 삽입하거나 그냥 push하고 정렬)
        DB.push(newPost);
    }
    
    sortDB(); // 재정렬 (최신글이 위로 오게)

// 4. 게시판 렌더링
function renderBoard() {
    const tbody = document.getElementById("board-body");
    tbody.innerHTML = "";

    // 탭 필터링
    let filtered = [];
    if(CURR_TAB === 'best') {
        filtered = DB.filter(p => !p.notice && p.rec >= 10);
    } else {
        filtered = DB;
    }

    // 페이징 계산
    const totalItems = filtered.length;
    const totalPages = Math.ceil(totalItems / POSTS_PER_PAGE);
    if(CURR_PAGE > totalPages) CURR_PAGE = totalPages > 0 ? totalPages : 1;
    
    const startIdx = (CURR_PAGE - 1) * POSTS_PER_PAGE;
    const endIdx = startIdx + POSTS_PER_PAGE;
    const pageData = filtered.slice(startIdx, endIdx);

    // HTML 생성
    pageData.forEach(p => {
        const tr = document.createElement("tr");
        if(p.notice) tr.classList.add("notice-row");
        if(!p.notice && p.rec >= 10) tr.classList.add("concept-row");

        // ID (공지 처리)
        const idStr = p.notice ? "<b>공지</b>" : p.id;
        
        // 제목 구성
        let titHtml = "";
        if(!p.notice && p.rec >= 10) titHtml += `<span class="icon-concept">개념</span>`;
        // 특정 이미지 아이콘 (그냥 일부 ID 대역에 랜덤하게 붙임)
        if(!p.notice && p.id % 5 === 0) titHtml += `<span class="icon-img"></span>`;
        
        titHtml += p.title.replace("{감독}", "<b>감독</b>");
        
        if(p.cmts.length > 0) {
            titHtml += `<span class="reply-cnt">[${p.cmts.length}]</span>`;
        }

        tr.innerHTML = `
            <td>${idStr}</td>
            <td class="td-tit" onclick="viewPost(${p.notice ? "'notice'" : p.id})">${titHtml}</td>
            <td>${p.nick}</td>
            <td>${p.date}</td>
            <td>${p.view.toLocaleString()}</td>
            <td>${p.rec}</td>
        `;
        tbody.appendChild(tr);
    });

    renderPagination(totalPages);
}

// 5. 사이드바 위젯 렌더링
function renderBestWidget() {
    const ul = document.getElementById("best-widget");
    ul.innerHTML = "";
    // 공지 제외, 추천순, 상위 8개
    const bests = DB.filter(p => !p.notice && p.rec >= 10)
                    .sort((a,b) => b.rec - a.rec)
                    .slice(0, 8);
    
    bests.forEach((p, idx) => {
        const li = document.createElement("li");
        li.onclick = () => viewPost(p.id);
        li.innerHTML = `
            <span class="rank-num">${idx+1}</span>
            <span class="rank-txt">${p.title.replace("{감독}", "감독")}</span>
        `;
        ul.appendChild(li);
    });
}

// 6. 페이징 UI
function renderPagination(totalPages) {
    const box = document.getElementById("pagination");
    box.innerHTML = "";
    
    // 최대 10개까지만 표시 (단순화)
    const maxView = 10;
    let start = Math.floor((CURR_PAGE-1)/maxView) * maxView + 1;
    let end = Math.min(start + maxView - 1, totalPages);

    if(start > 1) {
        const prev = document.createElement("div");
        prev.className = "pg-btn";
        prev.innerText = "이전";
        prev.onclick = () => { CURR_PAGE = start - 1; renderBoard(); };
        box.appendChild(prev);
    }

    for(let i=start; i<=end; i++) {
        const btn = document.createElement("div");
        btn.className = "pg-btn";
        if(i === CURR_PAGE) btn.classList.add("on");
        btn.innerText = i;
        btn.onclick = () => { CURR_PAGE = i; renderBoard(); };
        box.appendChild(btn);
    }

    if(end < totalPages) {
        const next = document.createElement("div");
        next.className = "pg-btn";
        next.innerText = "다음";
        next.onclick = () => { CURR_PAGE = end + 1; renderBoard(); };
        box.appendChild(next);
    }
}

// 탭 변경
function changeTab(mode) {
    CURR_TAB = mode;
    CURR_PAGE = 1;
    
    document.getElementById("tab-all").classList.remove("active");
    document.getElementById("tab-best").classList.remove("active");
    
    if(mode === 'all') document.getElementById("tab-all").classList.add("active");
    else document.getElementById("tab-best").classList.add("active");

    renderBoard();
}

    document.getElementById("v-views").innerText = post.view.toLocaleString();
    document.getElementById("v-recs").innerText = post.rec;
    document.getElementById("v-content").innerHTML = post.con.replace(/\n/g, "<br>");

    updateVoteUI(post.rec);
    renderComments(); // 댓글 로드
    renderBoard();
}

// ★ 수정됨: 댓글 목록 로드 (방금 삭제)
function renderComments() {
    const post = DB[CURR_IDX];
    const list = document.getElementById("cmt-list");
    list.innerHTML = "";
    document.getElementById("cmt-cnt").innerText = post.cmts.length;

    if(post.cmts.length === 0) {
        list.innerHTML = `<div style="padding:20px; text-align:center; color:#999;">등록된 댓글이 없습니다.</div>`;
    } else {
        post.cmts.forEach(c => {
            const div = document.createElement("div");
            div.className = "cmt-row";
            // "방금" div 삭제함 + 닉네임 옆 간격 추가
            div.innerHTML = `
                <div class="cmt-nick" style="margin-right:15px;">${c.n}</div>
                <div class="cmt-txt">${c.t}</div>
            `;
            list.appendChild(div);
        });
    }
}

function addComment() {
    const inp = document.getElementById("cmt-input");
    const val = inp.value.trim();
    if(!val) return;

    DB[CURR_IDX].cmts.push({ n: "감독", t: val });
    saveData();
    
    appendRealtimeComment("감독", val);
    
    inp.value = "";
    renderBoard();
}

function updateVoteUI(rec) {
    document.getElementById("vote-up").innerText = rec;
    document.getElementById("vote-down").innerText = Math.floor(rec / 10);
}

function doVote(type) {
    if(type === 1) {
        DB[CURR_IDX].rec++;
        alert("개념글로 추천하였습니다.");
    } else {
        alert("비추천하였습니다.");
    }
    saveData();
    updateVoteUI(DB[CURR_IDX].rec);
    document.getElementById("v-recs").innerText = DB[CURR_IDX].rec;
    renderBoard();
    renderBestWidget();
}

// 4. 글 쓰기
function openWrite() {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("view-layer").style.display = "none";
    document.getElementById("write-layer").style.display = "block";
    document.getElementById("m-tit").innerText = "게시글 작성";
    
    document.getElementById("w-tit").value = "";
    document.getElementById("w-con").value = "";
}

function savePost() {
    const tit = document.getElementById("w-tit").value.trim();
    const con = document.getElementById("w-con").value;

    if(!tit || !con) { alert("내용을 입력해주세요."); return; }

    let maxId = 0;
    DB.forEach(p => { if(!p.notice && typeof p.id === 'number' && p.id > maxId) maxId = p.id; });

    const d = new Date();
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

    const newPost = {
        id: maxId + 1,
        title: tit,
        nick: "감독",
        date: timeStr,
        view: 0, 
        rec: 0,
        notice: false,
        con: con.replace(/\n/g, "<br>"),
        cmts: []
    };

    DB.push(newPost);
    DB.sort((a,b) => {
        if(a.notice) return -1;
        if(b.notice) return 1;
        return b.id - a.id;
    });
    
    saveData();
    alert("등록되었습니다.");
    closeModal();
    renderBoard();
    
    window.scrollTo(0,0);
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
window.onclick = function(e) {
    if(e.target == document.getElementById("modal")) closeModal();
}
</script>
</body>
